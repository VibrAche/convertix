[pytest]
testpaths = tests
# Windows : libérer un proxy COM après Office.Quit() lève une exception SEH interceptée par RPC
# (0x80010108 / 0x800706be), sans effet, mais faulthandler l'affiche comme « fatal ».
addopts = -p no:faulthandler
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
